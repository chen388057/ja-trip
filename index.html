                const data = tripData[window.currentDayIdx];

                    <div class="flex justify-between py-2 border-b border-stone-100"><span>日本警察</span><a href="tel:110" class="font-black">110</a></div>
                    <div class="flex justify-between py-2 border-b border-stone-100"><span>曼谷急救</span><a href="tel:199" class="font-black text-red-600">199</a></div>
                    <div class="mt-4"><a href="https://www.jnto.go.jp/emergency/chc/mi_guide.html" target="_blank" class="text-blue-600 text-sm font-bold underline">日本醫療機構搜尋 (官方) ➜</a></div>
                </div>
            `;
            container.innerHTML = html;
            renderSyncSection('extras', window.customExtras, '自定義實用連結 ✨', true);
        }

        function renderLedger(dateKey, currency) {
            const dayExp = window.expensesRaw[dateKey.replace(/\//g, '-')] || {};
            let total = 0;
            let listHtml = Object.keys(dayExp).map(id => {
                const item = dayExp[id]; total += item.amount;
                return `<div class="ledger-row"><p class="font-bold">${item.name}</p><div class="flex items-center gap-4"><span class="font-black text-xl">${item.amount}</span><button onclick="window.deleteItem('expenses/${dateKey.replace(/\//g, '-')}', '${id}')" class="text-stone-300 text-2xl">×</button></div></div>`;
            }).join('');
            document.getElementById('main-content').innerHTML = `<div class="muji-card p-8 text-center bg-stone-800 text-white"><p class="text-xs uppercase text-stone-400">當日花費 (${currency})</p><p class="text-5xl font-black mt-2">${total}</p></div><div class="muji-card p-6">${listHtml || '<p class="text-center italic text-stone-300">無紀錄</p>'}</div><div class="muji-card p-6"><input type="text" id="add-n" class="ledger-input mb-4" placeholder="品項..."><input type="number" id="add-v" class="ledger-input mb-6" placeholder="金額..."><button onclick="window.addItem('expenses/${dateKey.replace(/\//g, '-')}', 'add-n', 'add-v')" class="w-full bg-stone-800 text-white py-4 rounded-xl font-bold">同步雲端</button></div>`;
        }

        function renderSyncSection(path, dataObj, title, append = false) {
            let listHtml = Object.keys(dataObj).map(id => {
                const item = dataObj[id];
                return `<div class="muji-card p-4 flex justify-between items-center"><a href="${item.url}" target="_blank" class="flex-1 font-bold">🔗 ${item.name}</a><button onclick="window.deleteItem('${path}', '${id}')" class="text-stone-300 text-3xl ml-4">×</button></div>`;
            }).join('');
            const sectionHtml = `<h2 class="font-bold text-xs mb-4 text-stone-400 uppercase">${title}</h2>${listHtml}<div class="muji-card p-6 mt-6"><input type="text" id="sync-n-${path}" class="ledger-input mb-4" placeholder="名稱..."><input type="text" id="sync-u-${path}" class="ledger-input mb-6" placeholder="網址..."><button onclick="window.addItem('${path}', 'sync-n-${path}', 'sync-u-${path}')" class="w-full bg-stone-800 text-white py-4 rounded-xl font-bold">新增連結</button></div>`;
            if(append) document.getElementById('main-content').insertAdjacentHTML('beforeend', sectionHtml);
            else document.getElementById('main-content').innerHTML = sectionHtml;
        }

        window.addItem = (path, nid, uid) => {
            const n = document.getElementById(nid).value;
            let u = document.getElementById(uid).value;
            if(!n || !u) return;
            const data = (uid === 'add-v') ? { name: n, amount: parseInt(u) } : { name: n, url: u.startsWith('http') ? u : 'https://' + u };
            push(ref(db, path), data);
            document.getElementById(nid).value = ''; document.getElementById(uid).value = '';
        };

        window.deleteItem = (path, id) => { if(confirm('確定刪除？')) remove(ref(db, `${path}/${id}`)); };

        window.switchMode = (m) => {
            window.currentMode = m;
            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.replace('text-stone-800', 'text-stone-300'));
            const activeBtn = document.getElementById('mode-' + m);
            if(activeBtn) activeBtn.classList.replace('text-stone-300', 'text-stone-800');
            window.renderContent();
        };

        const nav = document.getElementById('date-nav');
        dates.forEach((d, i) => {
            const btn = document.createElement('button');
            btn.className = `flex-shrink-0 px-7 py-3 rounded-2xl bg-white font-black border border-stone-200 transition-all ${i === 0 ? 'nav-active' : ''}`;
            btn.innerText = d;
            btn.onclick = (e) => {
                window.currentDayIdx = i;
                document.querySelectorAll('#date-nav button').forEach(b => b.classList.remove('nav-active'));
                e.currentTarget.classList.add('nav-active');
                window.renderContent();
            };
            nav.appendChild(btn);
        });

        onValue(ref(db, 'expenses'), snap => { window.expensesRaw = snap.val() || {}; window.renderContent(); });
        onValue(ref(db, 'coupons'), snap => { window.customCoupons = snap.val() || {}; window.renderContent(); });
        onValue(ref(db, 'extras'), snap => { window.customExtras = snap.val() || {}; window.renderContent(); });
    </script>
</body>
</html>
